<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Шахтёр — добывай ресурсы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { font-family: system-ui, sans-serif; background: #1e1e2f; color: #fff; margin: 0; padding: 16px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: #2a2a3b; border-radius: 20px; padding: 16px; margin-bottom: 12px; }
        .flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .balance { font-size: 20px; font-weight: bold; }
        .balance span { font-size: 14px; color: #aaa; }
        button { background: #ffb347; border: none; border-radius: 40px; padding: 10px 20px; font-weight: bold; color: #1e1e2f; cursor: pointer; }
        button:active { transform: scale(0.97); }
        .click-area { background: #3b3b4f; border-radius: 100px; text-align: center; padding: 30px; font-size: 48px; cursor: pointer; transition: 0.1s; }
        .click-area:active { transform: scale(0.95); }
        .nav { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; }
        .nav button { flex: 1; background: #3a3a4e; color: white; }
        .active-tab { background: #ffb347; color: black; }
        .section { display: none; }
        .section.active { display: block; }
        .miner-item { margin-bottom: 12px; background: #252535; border-radius: 16px; padding: 10px; }
        .price { color: #ffd966; }
        .error { color: #ff8888; }
        .success { color: #88ff88; }
    </style>
</head>
<body>
<div class="container">
    <div class="card flex">
        <div>💎 <span id="diamonds">0</span></div>
        <div>💰 <span id="gold">0</span></div>
        <div>🛢️ <span id="oil">0</span></div>
    </div>
    <div class="card click-area" id="clickArea">
        ⛏️ КЛИК
    </div>
    <div class="card">📈 Доход в сек: <span id="incomePerSec">0</span> 💎</div>

    <div class="nav">
        <button data-tab="mines">⛏️ Шахты</button>
        <button data-tab="shop">🛒 Магазин</button>
        <button data-tab="tasks">📋 Задания</button>
        <button data-tab="profile">👤 Профиль</button>
    </div>

    <!-- Вкладка Шахты -->
    <div id="mines" class="section active">
        <div class="card">
            <div class="flex"><span>🏭 Уровень шахты: <span id="mineLevel">1</span></span><button id="upgradeMine">Улучшить (золото)</button></div>
            <div>⛏️ Кирка ур. <span id="pickaxeLevel">1</span> <button id="upgradePickaxe">Улучшить (💎)</button></div>
        </div>
        <div id="minersList"></div>
    </div>

    <!-- Вкладка Магазин -->
    <div id="shop" class="section">
        <div class="card">
            <h3>📦 Боксы</h3>
            <button id="openCommonBox">Открыть обычный бокс (100💎)</button>
            <button id="openRareBox">Открыть редкий бокс (1000💎)</button>
            <button id="openDonatBox">Открыть донатный бокс (200🛢️)</button>
        </div>
        <div class="card">
            <h3>💱 Обмен</h3>
            <input type="number" id="exchangeAmount" placeholder="Алмазы">
            <button id="exchangeBtn">Обменять на золото (1 алмаз = 0.1 золота)</button>
        </div>
        <div class="card">
            <h3>⚡ Буст</h3>
            <button id="buyBoost2x">Купить x2 на 1 час (1000 золота)</button>
        </div>
    </div>

    <!-- Вкладка Задания (заглушка) -->
    <div id="tasks" class="section">
        <div class="card">📌 Задания будут доступны после админ-ивентов</div>
    </div>

    <!-- Вкладка Профиль -->
    <div id="profile" class="section">
        <div class="card">
            <p>⏱️ Время в игре: <span id="timePlayed">0</span> сек</p>
            <button id="withdrawOil">Вывести нефть (от 50🛢️)</button>
            <button id="depositOil">Пополнить нефть (от 50🛢️)</button>
            <hr>
            <button id="supportBtn">📞 Поддержка</button>
        </div>
        <div class="card">
            <h3>🏆 Топ игроков</h3>
            <div id="topList"></div>
        </div>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    let initDataUnsafe = tg.initDataUnsafe;
    let userId = initDataUnsafe.user?.id;
    if (!userId) {
        alert("Запустите приложение через Telegram");
        userId = "test123"; // для теста
    }

    let currentUser = {};
    let clickInterval = null;

    async function fetchUser() {
        const res = await fetch(`/api/user/${userId}`);
        const data = await res.json();
        if (data.banned) return alert("Вы забанены");
        currentUser = data;
        updateUI();
    }

    function updateUI() {
        document.getElementById('diamonds').innerText = currentUser.diamonds || 0;
        document.getElementById('gold').innerText = currentUser.gold || 0;
        document.getElementById('oil').innerText = currentUser.oil || 0;
        document.getElementById('incomePerSec').innerText = currentUser.incomePerSec || 0;
        document.getElementById('mineLevel').innerText = currentUser.mineLevel;
        document.getElementById('pickaxeLevel').innerText = currentUser.pickaxeLevel;
        document.getElementById('timePlayed').innerText = currentUser.totalTimePlayed || 0;
        renderMiners();
    }

    function renderMiners() {
        const container = document.getElementById('minersList');
        container.innerHTML = '';
        for (let lvl=1; lvl<=7; lvl++) {
            const count = currentUser.miners[lvl] || 0;
            const nextPrice = getMinerPrice(lvl, count+1);
            container.innerHTML += `
                <div class="miner-item flex">
                    <div>⛏️ Шахтёр ${lvl} ур. (кол-во: ${count})<br>Доход: ${MINER_INCOME_BASE[lvl]}💎/сек</div>
                    <button class="buyMinerBtn" data-level="${lvl}">Купить за ${nextPrice}💎</button>
                </div>
            `;
        }
        document.querySelectorAll('.buyMinerBtn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const level = parseInt(btn.dataset.level);
                const res = await fetch('/api/buy-miner', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({uid:userId, level}) });
                const result = await res.json();
                if(result.success) fetchUser();
                else alert(result.error);
            });
        });
    }

    // Helper для цены шахтера
    const MINER_BASE_PRICE = [0,100,200,350,550,800,1100,1500];
    function getMinerPrice(level, count) {
        let base = MINER_BASE_PRICE[level];
        return Math.floor(base * Math.pow(1.35, count-1));
    }
    const MINER_INCOME_BASE = [0,5,10,20,35,55,80,120];

    // Кликер (простой клик)
    async function sendClick(clicks=1) {
        const res = await fetch('/api/click', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({uid:userId, clicks}) });
        const data = await res.json();
        if(data.success) fetchUser();
    }
    // Обработка зажима
    let clickTimer = null;
    let clickCount = 0;
    function startHold() {
        clickCount = 0;
        clickTimer = setInterval(() => {
            clickCount++;
            sendClick(1);
        }, 100);
    }
    function endHold() {
        clearInterval(clickTimer);
    }
    document.getElementById('clickArea').addEventListener('mousedown', startHold);
    document.getElementById('clickArea').addEventListener('mouseup', endHold);
    document.getElementById('clickArea').addEventListener('touchstart', startHold);
    document.getElementById('clickArea').addEventListener('touchend', endHold);
    document.getElementById('clickArea').addEventListener('click', () => sendClick(1));

    // Обмен
    document.getElementById('exchangeBtn').addEventListener('click', async () => {
        const amount = parseInt(document.getElementById('exchangeAmount').value);
        if(isNaN(amount)) return;
        const res = await fetch('/api/exchange', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({uid:userId, diamondsAmount:amount}) });
        const data = await res.json();
        if(data.success) fetchUser();
        else alert(data.error);
    });

    // Улучшения
    document.getElementById('upgradeMine').addEventListener('click', async () => {
        const res = await fetch('/api/upgrade-mine', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({uid:userId}) });
        const data = await res.json();
        if(data.success) fetchUser();
        else alert(data.error);
    });
    document.getElementById('upgradePickaxe').addEventListener('click', async () => {
        const res = await fetch('/api/upgrade-pickaxe', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({uid:userId}) });
        const data = await res.json();
        if(data.success) fetchUser();
        else alert(data.error);
    });

    // Боксы
    document.getElementById('openCommonBox').addEventListener('click', () => openBox('common'));
    document.getElementById('openRareBox').addEventListener('click', () => openBox('rare'));
    document.getElementById('openDonatBox').addEventListener('click', () => openBox('donat'));
    async function openBox(type) {
        const res = await fetch('/api/open-box', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({uid:userId, boxType:type}) });
        const data = await res.json();
        if(data.success) {
            alert(`Вы получили ${data.reward} ${data.rewardCurrency}`);
            fetchUser();
        } else alert(data.error);
    }

    // Буст
    document.getElementById('buyBoost2x').addEventListener('click', async () => {
        const res = await fetch('/api/buy-boost', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({uid:userId, multiplier:2, durationSeconds:3600}) });
        const data = await res.json();
        if(data.success) fetchUser();
        else alert(data.error);
    });

    // Вывод / пополнение нефти
    document.getElementById('withdrawOil').addEventListener('click', async () => {
        let amount = prompt("Сколько нефти вывести? (мин 50)");
        if(amount && amount>=50) {
            const res = await fetch('/api/withdraw-oil', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({uid:userId, amount:parseInt(amount)}) });
            const data = await res.json();
            if(data.success) alert("Заявка отправлена");
            else alert(data.error);
        } else alert("Введите корректную сумму");
    });
    document.getElementById('depositOil').addEventListener('click', async () => {
        let amount = prompt("Сколько нефти пополнить? (мин 50)");
        if(amount && amount>=50) {
            // Здесь в реальности должна быть оплата, для демо просто выдаём
            const res = await fetch('/api/deposit-oil', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({uid:userId, amount:parseInt(amount)}) });
            const data = await res.json();
            if(data.success) fetchUser();
            else alert(data.error);
        }
    });
    document.getElementById('supportBtn').addEventListener('click', () => {
        tg.openTelegramLink('https://t.me/nukm0');
    });

    // Топ
    async function loadTop() {
        const res = await fetch('/api/top');
        const top = await res.json();
        let html = '<ol>';
        top.forEach(u => html += `<li>${u.uid.slice(0,6)}... 💎${u.diamonds} 🛢️${u.oil}</li>`);
        html += '</ol>';
        document.getElementById('topList').innerHTML = html;
    }

    // Навигация
    document.querySelectorAll('.nav button').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.dataset.tab;
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
        });
    });

    // Запуск
    fetchUser();
    loadTop();
    setInterval(fetchUser, 5000); // обновление каждые 5 сек
</script>
</body>
</html>
